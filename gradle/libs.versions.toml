[versions]
material = "1.14.0"
rxandroid = "3.0.2"
activity = "1.13.0"
appcompat = "1.8.0"
lifecycleLivedata = "2.11.0"
lifecycleViewmodel = "2.11.0"
constraintlayout = "2.2.2"
swiperefreshlayout = "1.2.0"

shimmer = "0.5.0"

singledateandtimepicker = "2.2.7"

googleid = "1.2.0"
integrity = "1.6.0"

biometric = "1.1.0"

retrofit = "3.0.0"
picasso = "2.71828"
okhttp = "5.5.0"

converterGson = "3.0.0"
loggingInterceptor = "5.5.0"

barcodeScanning = "17.3.0"
cameraCore = "1.6.2"

textRecognition = "16.0.1"

androidImageCropper = "4.5.0"

photoview = "2.3.0"
glide = "5.0.9"

gson = "2.14.0"

firebaseBom = "34.19.0"

blurview = "version-3.2.0"

agp = "9.4.0"
kotlin = "2.1.0"
googleServices = "4.4.2"

[libraries]
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
rxandroid = { module = "io.reactivex.rxjava3:rxandroid", version.ref = "rxandroid" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-lifecycle-livedata = { group = "androidx.lifecycle", name = "lifecycle-livedata", version.ref = "lifecycleLivedata" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycleViewmodel" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }

shimmer = { module = "com.facebook.shimmer:shimmer", version.ref = "shimmer" }

singledateandtimepicker = { module = "com.github.florent37:singledateandtimepicker", version.ref = "singledateandtimepicker" }

androidx-credentials = { module = "androidx.credentials:credentials", version = "1.6.0" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version = "1.6.0" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }
integrity = { module = "com.google.android.play:integrity", version.ref = "integrity" }

androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }

retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
picasso = { module = "com.squareup.picasso:picasso", version.ref = "picasso" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "converterGson" }
converter-scalars = { module = "com.squareup.retrofit2:converter-scalars", version.ref = "converterGson" }
logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "loggingInterceptor" }

barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "barcodeScanning" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "cameraCore" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "cameraCore" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "cameraCore" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "cameraCore" }

text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "textRecognition" }

android-image-cropper = { module = "com.github.CanHub:Android-Image-Cropper", version.ref = "androidImageCropper" }

photoview = { module = "com.github.chrisbanes:PhotoView", version.ref = "photoview" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
compiler = { module = "com.github.bumptech.glide:compiler", version.ref = "glide" }

gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }

blurview = { module = "com.github.Dimezis:BlurView", version.ref = "blurview" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

